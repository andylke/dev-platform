services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    container_name: seaweedfs
    hostname: seaweedfs
    restart: unless-stopped

    networks:
      - backend
      - tools

    command:
      - mini
      - -dir=/data

    volumes:
      - ./infra/seaweedfs/runtime/volumes/data:/data

    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${SEAWEEDFS_S3_BUCKETS}
