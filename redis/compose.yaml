services:

  redis:
    image: redis:${REDIS_VERSION}
    container_name: redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"

    networks:
      - backend
      - tools

    volumes:
      - ./share/ca-certificates:/ca-certificates:ro
      - ./redis/certificates:/certificates:ro
      - ./redis/runtime/config:/usr/local/etc/redis:ro
      - ./redis/runtime/volumes/data:/data

    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
